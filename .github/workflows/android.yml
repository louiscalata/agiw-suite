name: Android monitor

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  unit:
    name: android unit and lint
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "box-linux"]' || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: monitor-core checks
        working-directory: android/monitor-core
        run: sh check.sh
      - name: Install the pinned SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: sh android/ci/sdk.sh
      - name: Lint, unit tests, and debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: ./gradlew :monitor-core:test :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

  emulator:
    name: android emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned SDK and the API 35 image
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
          AGIW_SDK_EMULATOR: '1'
        run: sh android/ci/sdk.sh
      - name: Instrumentation tests and window smoke
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: sh android/ci/emulator-smoke.sh
