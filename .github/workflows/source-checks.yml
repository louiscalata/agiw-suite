name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: monitor (${{ matrix.python }})
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Python tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          # The 45 router dual-read integration tests require state writers
          # owned by the separate router project, not this source package.
          MONITOR_ALLOW_ROUTER_FIXTURE_SKIP: '1'
        run: python3 -B -m unittest discover -p 'test_*.py' -q
      - name: JavaScript tests
        run: node --test test_*.mjs
      - name: Windows edition tests
        working-directory: windows
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -q
      - name: Mac build input checks
        run: |
          bash -n build.sh login-agent.sh package-release.sh
          plutil -lint Info.plist
          xcrun swiftc -typecheck -target arm64-apple-macosx13.0 -framework Cocoa -framework WebKit Monitor.swift
          xcrun swiftc -typecheck -target arm64-apple-macosx13.0 -framework Cocoa -framework Security JevKeychain.swift
          python3 -B bundle_nisi.py --verify
          node --check web/components.js
          node --check web/monitor.mjs

  # Chromium emulation of forced-colors: active. Not a Windows High Contrast
  # hardware pass. Ubuntu only: the macOS job does not install Playwright.
  forced-colors:
    name: forced-colors emulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install Chromium for the emulation
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          (cd "$RUNNER_TEMP/pw" && npx playwright install --with-deps chromium)
      - name: Emulate forced-colors on / and /monitor
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node checks/forced-colors-emulation.mjs
      - name: Prove the overview paints ink
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node checks/overview-ink.mjs
      - name: Prove the overview map is flat ink
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node checks/overview-flat-map.mjs

  # Branch protection requires a check named exactly "monitor". A matrix job
  # reports only "monitor (<version>)", so this job reports the combined result.
  monitor:
    if: ${{ always() }}
    needs: [tests, forced-colors]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the suites and the forced-colors emulation
        env:
          RESULT: ${{ needs.tests.result }}
          FORCED: ${{ needs.forced-colors.result }}
        run: test "$RESULT" = success && test "$FORCED" = success
