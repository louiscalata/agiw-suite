name: Windows edition

# The Windows edition's tests, run natively on Windows. On macOS and Linux the Windows-only cases skip, so this is the
# only place they run.
on:
  push:
    branches: [main]
    paths: ['windows/**', 'peer_link.py', 'peer_feed.py', 'machine_state.py', 'inference_collect.py',
            'fleet_state.py', 'remote_machines.py', 'eci_tuning.py', 'eci_fast_check.py',
            'eci_fast_check.schema.json', 'eci_tuning_catalog.json', 'eci_tuning_routes.json',
            'eci_tuning.schema.json', 'online_code_repair.py',
            'inference_stats.py', 'client_models.py', 'usage-format.mjs', 'web/**', 'jaryo/**',
            'test_*.mjs', 'android/**', 'wrapper-patch/**', '.gitattributes',
            '.github/workflows/windows-edition.yml']
  pull_request:
    paths: ['windows/**', 'peer_link.py', 'peer_feed.py', 'machine_state.py', 'inference_collect.py',
            'fleet_state.py', 'remote_machines.py', 'eci_tuning.py', 'eci_fast_check.py',
            'eci_fast_check.schema.json', 'eci_tuning_catalog.json', 'eci_tuning_routes.json',
            'eci_tuning.schema.json', 'online_code_repair.py',
            'inference_stats.py', 'client_models.py', 'usage-format.mjs', 'web/**', 'jaryo/**',
            'test_*.mjs', 'android/**', 'wrapper-patch/**', '.gitattributes',
            '.github/workflows/windows-edition.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: windows edition (${{ matrix.python }})
    # Same-repo events use Louis's PC runner; fork pull requests stay on GitHub-hosted Windows.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","pc-win"]') || 'windows-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Windows edition tests
        working-directory: windows
        # cmd, not the default pwsh: pwsh puts its own module folders first in PSModulePath, and the installer tests
        # start Windows PowerShell 5.1, which then cannot load Microsoft.PowerShell.Security (Get-Acl, Get-FileHash).
        shell: cmd
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

  # The root JavaScript suite is what failed on a Windows checkout (CRLF in two unpinned text
  # files). It runs once, not once per Python version.
  node:
    name: windows node tests
    # Same-repo events use Louis's PC runner; fork pull requests stay on GitHub-hosted Windows.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","pc-win"]') || 'windows-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Root JavaScript tests
        run: node --test test_*.mjs
