name: CLI

on:
  push:
    branches: [main]
    paths: ['agiw/**', 'tests_cli/**', 'peer_link.py', 'machine_state.py', 'pyproject.toml', 'README.md', 'docs/cli.md', '.github/workflows/cli.yml']
  pull_request:
    paths: ['agiw/**', 'tests_cli/**', 'peer_link.py', 'machine_state.py', 'pyproject.toml', 'README.md', 'docs/cli.md', '.github/workflows/cli.yml']

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 runs the same suite. Tests pass kind mac when the runner is
        # Linux, so this job is not a Linux host. The product still refuses Linux
        # when kind is omitted. macos-latest here is GitHub-hosted, not the Mac.
        # Pin 24.04: ubuntu-latest is 26.04, and setup-python has no CPython 3.9 there.
        os: [macos-latest, windows-latest, ubuntu-24.04]
        python: ['3.9', '3.12']
    # Same-repo legs use their matching self-hosted runner; fork pull requests stay on GitHub-hosted runners.
    runs-on: ${{ matrix.os == 'macos-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","mac-m5"]') || matrix.os == 'windows-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","pc-win"]') || matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: CLI tests (fake service runner; peers on 127.0.0.1 only)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests_cli -v
      - name: Install and start the command
        shell: bash
        run: |
          python -m pip install .
          agiw --help
          agiw --version
          python -m agiw --version
