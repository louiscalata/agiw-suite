<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">AS — AGIW Suite</title>
  <desc id="desc">A crisp white AS monogram on black, framed by a quiet cyan and violet glow.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9cefff"/>
      <stop offset=".52" stop-color="#b6c4db"/>
      <stop offset="1" stop-color="#a89aff"/>
    </linearGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect x="15" y="15" width="98" height="98" rx="19" fill="none" stroke="url(#edge)" stroke-width="3" opacity=".7" filter="url(#halo)"/>
  <rect x="15" y="15" width="98" height="98" rx="19" fill="#050505" stroke="url(#edge)" stroke-width="1.25"/>
  <text x="62" y="82" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="51" font-weight="700" letter-spacing="-4" text-anchor="middle">AS</text>
</svg>
