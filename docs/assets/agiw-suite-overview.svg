<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">AGIW Suite — local inference, with a clear view</title>
  <desc id="desc">A black banner with a glowing AS mark. AGIW Inference Monitor brings model activity, resource readings, explicit controls and optional connections into view. Requirements and capability details follow as readable page text.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8ceaff"/>
      <stop offset=".5" stop-color="#b6d8ff"/>
      <stop offset="1" stop-color="#bfa8ff"/>
    </linearGradient>
    <radialGradient id="cyan">
      <stop stop-color="#41d9ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#41d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet">
      <stop stop-color="#9974ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#9974ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="halo" x="-75%" y="-75%" width="250%" height="250%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="letterGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="panel"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="1280" height="420" fill="#020304"/>
    <ellipse cx="128" cy="132" rx="292" ry="235" fill="url(#cyan)"/>
    <ellipse cx="1140" cy="390" rx="360" ry="218" fill="url(#violet)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="419" rx="23.5" fill="none" stroke="#293039"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <rect x="64" y="72" width="132" height="132" rx="29" fill="none" stroke="url(#edge)" stroke-width="5" opacity=".85" filter="url(#halo)"/>
    <rect x="64" y="72" width="132" height="132" rx="29" fill="#030507" stroke="url(#edge)" stroke-width="1.5"/>
    <text x="127" y="160" fill="#93e5ff" opacity=".45" font-size="66" font-weight="700" letter-spacing="-5" text-anchor="middle" filter="url(#letterGlow)">AS</text>
    <text x="127" y="160" fill="#f5faff" font-size="66" font-weight="700" letter-spacing="-5" text-anchor="middle">AS</text>
    <text x="244" y="81" fill="#a7bfd1" font-size="17" font-weight="600" letter-spacing="3">AGIW SUITE / INFERENCE MONITOR</text>
    <g fill="#f2f7fc" font-size="58" font-weight="700" letter-spacing="-1.8">
      <text x="240" y="145">Local inference,</text>
      <text x="240" y="209">with a clear view.</text>
    </g>
    <text x="64" y="269" fill="#bdcbd9" font-size="23">Model activity. Resource pressure. Explicit controls.</text>
    <path d="M64 311H1216" stroke="#26323d"/>
    <g font-size="12" font-weight="600" letter-spacing="1.6">
      <text x="64" y="346" fill="#8ee9ff">01 / OBSERVE</text>
      <text x="360" y="346" fill="#a8d2ff">02 / UNDERSTAND</text>
      <text x="656" y="346" fill="#c0b4ff">03 / CONTROL</text>
      <text x="952" y="346" fill="#d3b9ff">04 / CONNECT</text>
    </g>
    <g fill="#e6edf6" font-size="22" font-weight="500">
      <text x="64" y="380">Inventory &amp; activity</text>
      <text x="360" y="380">Memory &amp; GPU</text>
      <text x="656" y="380">Guarded actions</text>
      <text x="952" y="380">Nisi &amp; optional Jev</text>
    </g>
  </g>
</svg>
