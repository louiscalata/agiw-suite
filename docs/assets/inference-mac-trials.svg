<title id="chart-title">Apple-silicon Mac GPT-OSS 20B: 21 full-request throughput observations</title>
<desc id="chart-desc">A zero-baseline dot plot shows all seven observed trials for each task, with task medians: generation 72.302, coding 72.842 and reasoning 72.240 tokens per full request second. Overall median is 72.482 across 21 requests with output. Generation range is 59.500 to 72.711, coding 72.743 to 73.156, and reasoning 70.431 to 72.646. Output availability is not accuracy, and this is not a matched AGIW-off/on test.</desc>
