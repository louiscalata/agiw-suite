<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">Latest retained local samples, not concurrent</title><desc id="desc">One distinct sample per machine. Linux Qwen3.5-4B generated at 36.84 tokens per second and passed 16 semantic cases. Mac Qwen3.8-27B MLX generated at 16.39 but semantic review rejected its answer. PC Qwen3.8-27B Q4_K_M with six AMD layers generated at 2.06 and passed seven code cases. These different workloads do not rank hardware or establish cluster throughput.</desc><rect width="1280" height="820" rx="24" fill="#0b1422"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="56" y="55" fill="#6ee7e4" font-size="15" font-weight="700" letter-spacing="3">AGIW SUITE / RETAINED GENERATION RECORDS</text><text x="56" y="108" fill="#f2f7ff" font-size="36" font-weight="700">Latest retained local samples · not concurrent</text><text x="56" y="145" fill="#aebfd4" font-size="20">Different models and workloads · one observation each · not a hardware ranking</text><rect x="56" y="174" width="1168" height="45" rx="12" fill="#203148"/><text x="80" y="203" fill="#d9e8fc" font-size="18" font-weight="600">Simultaneous three-machine throughput: not yet measured. No combined total is claimed.</text><line x1="500" y1="265" x2="500" y2="663" stroke="#28364a"/><text x="500" y="254" text-anchor="middle" fill="#8da4bf" font-size="15">0</text><line x1="670" y1="265" x2="670" y2="663" stroke="#28364a"/><text x="670" y="254" text-anchor="middle" fill="#8da4bf" font-size="15">10</text><line x1="840" y1="265" x2="840" y2="663" stroke="#28364a"/><text x="840" y="254" text-anchor="middle" fill="#8da4bf" font-size="15">20</text><line x1="1010" y1="265" x2="1010" y2="663" stroke="#28364a"/><text x="1010" y="254" text-anchor="middle" fill="#8da4bf" font-size="15">30</text><line x1="1180" y1="265" x2="1180" y2="663" stroke="#28364a"/><text x="1180" y="254" text-anchor="middle" fill="#8da4bf" font-size="15">40</text><text x="56" y="300" fill="#f1f6ff" font-size="25" font-weight="700">Linux</text><text x="56" y="330" fill="#b8c9df" font-size="17">Qwen3.5-4B Q6_K · RX 580 / 33 layers</text><text x="56" y="357" fill="#879eb9" font-size="15">16 Oct 2026 · 107 output tokens</text><rect x="500" y="280" width="626.287" height="28" rx="7" fill="#4bd6c2"/><text x="1138.287" y="302" fill="#f5f8ff" font-size="22" font-weight="700">36.84</text><text x="500" y="336" fill="#91e8cb" font-size="16" font-weight="600">16/16 semantic cases passed · exact cleanup verified</text><text x="56" y="445" fill="#f1f6ff" font-size="25" font-weight="700">Mac</text><text x="56" y="475" fill="#b8c9df" font-size="17">Qwen3.8-27B MLX 4-bit · M5 Pro</text><text x="56" y="502" fill="#879eb9" font-size="15">15 Oct 2026 · 141 output tokens</text><rect x="500" y="425" width="278.636" height="28" rx="7" fill="#b7a4fa"/><text x="790.636" y="447" fill="#f5f8ff" font-size="22" font-weight="700">16.39</text><text x="500" y="481" fill="#ffce7b" font-size="16" font-weight="600">SEMANTIC REVIEW REJECTED · exact unload verified</text><text x="56" y="590" fill="#f1f6ff" font-size="25" font-weight="700">PC</text><text x="56" y="620" fill="#b8c9df" font-size="17">Qwen3.8-27B Q4_K_M · AMD / 6 layers</text><text x="56" y="647" fill="#879eb9" font-size="15">16 Oct 2026 · 31 output tokens</text><rect x="500" y="570" width="35.003" height="28" rx="7" fill="#69a8ff"/><text x="547.003" y="592" fill="#f5f8ff" font-size="22" font-weight="700">2.06</text><text x="500" y="626" fill="#91e8cb" font-size="16" font-weight="600">7/7 code cases + 13/13 owned cleanup checks passed</text><text x="1180" y="700" text-anchor="end" fill="#b9cce3" font-size="17">Engine/server-reported generation tokens per second</text><line x1="56" y1="724" x2="1224" y2="724" stroke="#304159"/><text x="56" y="757" fill="#a9bbd2" font-size="16">Rates use retained engine fields. Full request time, quality and model release are reported separately.</text><text x="56" y="785" fill="#a9bbd2" font-size="16">Different tokenizers, models and placement prevent a meaningful summed or hardware-comparison rate.</text></g></svg>