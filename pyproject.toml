# The `agiw` command-line tool only. The Mac app is built by build.sh from an explicit file list and
# does not read this file; the Windows observer keeps its own installer. Linux is not supported.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agiw"
version = "1.1.0"
description = "Pair your Mac and Windows PC with a PIN and read their signed AGIW status over the LAN"
readme = "docs/cli.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Louis Calata" }]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Source = "https://github.com/louiscalata/agiw-suite"
Documentation = "https://github.com/louiscalata/agiw-suite/blob/main/docs/cli.md"

[project.scripts]
agiw = "agiw.cli:main"
agiw-orchestrator = "agiw.orchestrator_mcp:main"

[tool.setuptools]
# Only the CLI package, peer link and frozen machine-state core; other monitor modules are not packaged.
packages = ["agiw"]
py-modules = ["peer_link", "machine_state"]
include-package-data = false

# Ruff is pinned in CI (.github/workflows/source-checks.yml, job `lint`). See docs/python-style.md.
[tool.ruff]
required-version = "==0.17.4"
line-length = 120
target-version = "py39"
# Keep this lane in the Python source tree. Windows has a separate edition; the Nisi bundle is pinned.
# Build/generated trees and historical evidence copies retain their original bytes.
extend-exclude = [
    "vendor",
    "android",
    "jaryo",
    "web",
    "build",
    "dist",
    "**/generated/**",
    "**/evidence/**",
    "**/verification/**",
    "**/releases/**",
    "**/release-hashes/**",
]
# Explicit paths from editors or scripts must respect the same protected trees.
force-exclude = true
# Exports may sit below an ignored review directory. Scope comes from this config, never parent Git ignores.
respect-gitignore = false
# Ruff 0.17 also supports Python blocks in Markdown; dated documents are outside this lane.
include = ["*.py"]

[tool.ruff.format]
# Linted, but not reformatted yet (LOU-83). server.py and machine_state.py keep exact source-layout assertions in
# test_setup_page.mjs, test_machines_page.mjs and test_peer_map.mjs (single-quoted route tables, frozenset literal).
# TODO(LOU-83): reformat windows/ in its own reviewed pull request; it is a separate edition with its own CI.
exclude = ["server.py", "machine_state.py", "windows/**"]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = false

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", # pycodestyle errors and pyflakes
    "W",                   # whitespace
    "I",                   # import order
    "B",                   # bugbear
    "UP",                  # pyupgrade, limited by target-version
    "N",                   # pep8-naming
    "C90",                 # complexity
    "RUF100",              # unused noqa
    "BLE",                 # broad exception handling
    "T20",                 # library output
]

[tool.ruff.lint.mccabe]
max-complexity = 15

# BEGIN generated Python lint baseline
# Exact-file baseline for existing findings after Ruff formatting; never a blanket test ignore.
# This lane preserves the docstring-normalised AST. Each cleanup needs its own review.
# Remove a rule from its file when that finding is repaired. New files receive all selected rules.
[tool.ruff.lint.per-file-ignores]

