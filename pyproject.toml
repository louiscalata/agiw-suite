# The `agiw` command-line tool only. The Mac app is built by build.sh from an explicit file list and
# does not read this file; the Windows observer keeps its own installer. Linux is not supported.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agiw"
version = "1.1.0"
description = "Pair your Mac and Windows PC with a PIN and read their signed AGIW status over the LAN"
readme = "docs/cli.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Louis Calata" }]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Source = "https://github.com/louiscalata/agiw-suite"
Documentation = "https://github.com/louiscalata/agiw-suite/blob/main/docs/cli.md"

[project.scripts]
agiw = "agiw.cli:main"

[tool.setuptools]
# Only the CLI package, peer link and frozen machine-state core; other monitor modules are not packaged.
packages = ["agiw"]
py-modules = ["peer_link", "machine_state"]
include-package-data = false
